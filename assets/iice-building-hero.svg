<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 510" width="650" height="510">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2537"/>
      <stop offset="45%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#6c3231"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="warmSlab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf9f6"/>
      <stop offset="100%" stop-color="#e5e0d5"/>
    </linearGradient>
    <pattern id="archGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="650" height="510" rx="24" fill="url(#skyGrad)"/>
  <rect width="650" height="510" rx="24" fill="url(#archGrid)"/>
  <circle cx="520" cy="110" r="140" fill="#ff8a40" fill-opacity="0.16"/>
  <circle cx="140" cy="400" r="170" fill="#38bdf8" fill-opacity="0.1"/>

  <!-- Top Badge Bar -->
  <rect x="28" y="24" width="350" height="36" rx="18" fill="#09181d" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.22"/>
  <circle cx="48" cy="42" r="5" fill="#4ade80"/>
  <text x="64" y="47" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="0.8">IISER BHOPAL · MAIN BUILDING (2ND FLOOR)</text>

  <rect x="442" y="24" width="180" height="36" rx="18" fill="#ff8a40" fill-opacity="0.92"/>
  <text x="532" y="47" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.8">10,000+ SQ. FT. TBI</text>

  <!-- Architectural Illustration of IISER Bhopal Main Building &amp; 2nd Floor IICE Wing -->
  <g transform="translate(45, 95)">
    <!-- Lawn / Campus Ground -->
    <rect x="0" y="275" width="560" height="36" rx="10" fill="#14532d" fill-opacity="0.75"/>
    <path d="M20 275 L540 275" stroke="#4ade80" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Left Academic Wing -->
    <rect x="24" y="95" width="140" height="180" rx="6" fill="url(#warmSlab)" stroke="#9a3412" stroke-width="1.5"/>
    <!-- Central Atrium Tower -->
    <rect x="156" y="45" width="248" height="230" rx="8" fill="#ffffff" stroke="#6c3231" stroke-width="2"/>
    <rect x="172" y="62" width="216" height="52" rx="4" fill="url(#glassGrad)" stroke="#0284c7" stroke-width="1.2"/>
    <!-- Highlighted 2nd Floor IICE Incubation Floor -->
    <rect x="20" y="122" width="520" height="64" rx="8" fill="#fff7ed" stroke="#ff8a40" stroke-width="3"/>
    <rect x="32" y="132" width="120" height="44" rx="5" fill="#9a3412"/>
    <text x="92" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff">IICE FLOOR</text>
    <text x="92" y="167" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#fed7aa">2ND FLOOR · MAIN BLDG</text>
    <!-- 2nd Floor Lab &amp; Cubicle Windows -->
    <rect x="166" y="134" width="82" height="40" rx="4" fill="#1e3a5f"/>
    <text x="207" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38bdf8">WET &amp; DRY LABS</text>
    <rect x="258" y="134" width="88" height="40" rx="4" fill="#1e3a5f"/>
    <text x="302" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#4ade80">STARTUP CUBES</text>
    <rect x="356" y="134" width="84" height="40" rx="4" fill="#1e3a5f"/>
    <text x="398" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#fbbf24">CIF ACCESS</text>
    <rect x="450" y="134" width="76" height="40" rx="4" fill="#1e3a5f"/>
    <text x="488" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#f87171">BIRAC-EDGE</text>

    <!-- Right Wing -->
    <rect x="396" y="95" width="140" height="80" rx="6" fill="url(#warmSlab)" stroke="#9a3412" stroke-width="1.5" fill-opacity="0.35"/>
    <rect x="396" y="186" width="140" height="89" rx="6" fill="url(#warmSlab)" stroke="#9a3412" stroke-width="1.5"/>

    <!-- Ground Floor Pillars &amp; Entrance -->
    <rect x="226" y="200" width="108" height="75" rx="6" fill="#0f2537"/>
    <text x="280" y="232" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff">IISER BHOPAL</text>
    <text x="280" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#94a3b8">BHAURI CAMPUS · 200 ACRES</text>
  </g>

  <!-- Bottom Metrics Strip on Hero Card -->
  <rect x="28" y="408" width="594" height="76" rx="16" fill="#09181d" fill-opacity="0.86" stroke="#ffffff" stroke-opacity="0.18"/>
  <g transform="translate(52, 428)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ff8a40">14+ Ventures</text>
    <text x="0" y="36" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#cbd5e1">DEEP-TECH &amp; BIOSCIENCE</text>

    <line x1="175" y1="2" x2="175" y2="40" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="198" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#38bdf8">500/700 MHz</text>
    <text x="198" y="36" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#cbd5e1">NMR · HRMS · XRD · FESEM</text>

    <line x1="388" y1="2" x2="388" y2="40" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="410" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#4ade80">DST NIDHI-TBI</text>
    <text x="410" y="36" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#cbd5e1">BIRAC BIG/EDGE &amp; MSME RAMP</text>
  </g>
</svg>