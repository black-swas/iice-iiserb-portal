# Generated by `npm run cms:config` from src/content/schema.ts. Do not edit by hand: change the schema or
# scripts/lib/cms-config.ts and regenerate. tests/unit/cms-config.test.ts fails if this file drifts.
backend:
  name: github
  repo: black-swas/IICE-project
  branch: main
local_backend: true
publish_mode: editorial_workflow
media_folder: content/media/uploads
public_folder: media/uploads
locale: en
collections:
  - name: announcements
    label: Announcements
    label_singular: announcement
    folder: content/announcements
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: text
    summary: "{{text}}"
    sortable_fields:
      - startsAt
      - expiresAt
    fields:
      - label: Unconfirmed
        name: _status
        required: false
        hint: Set while any value in this entry is unconfirmed. Clear it once IICE has confirmed everything.
        widget: select
        options:
          - label: Needs confirming
            value: TODO_CONFIRM
      - label: What needs confirming
        name: _note
        required: false
        hint: What to confirm, and with whom.
        widget: text
      - label: Source
        name: _source
        required: false
        hint: Where a fact came from, for example a document and its date.
        widget: string
      - label: Slug
        name: slug
        hint: Lower-case words joined by hyphens. It must match the file name and cannot be changed later. (up to 80 characters)
        widget: string
        pattern:
          - ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - Lower-case words joined by hyphens
      - label: Draft
        name: draft
        required: false
        hint: Drafts are left out of the live site.
        widget: boolean
        default: false
      - label: Updated at
        name: updatedAt
        required: false
        hint: Shown as 'Last updated'.
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: Text
        name: text
        widget: text
        pattern:
          - ^[\s\S]{0,120}$
          - Up to 120 characters
        hint: Up to 120 characters.
      - label: Kind
        name: kind
        widget: select
        options:
          - label: Open call
            value: open-call
          - label: Hiring
            value: hiring
          - label: Event registration
            value: event-registration
          - label: Notice
            value: notice
      - label: Href
        name: href
        required: false
        widget: string
        hint: "A site path such as /apply/, an https:// link, mailto: or tel:."
      - label: Starts at
        name: startsAt
        widget: datetime
        format: YYYY-MM-DDTHH:mm:ssZ
        date_format: YYYY-MM-DD
        time_format: HH:mm
        picker_utc: false
        hint: Use Indian Standard Time (+05:30).
      - label: Expires at
        name: expiresAt
        widget: datetime
        format: YYYY-MM-DDTHH:mm:ssZ
        date_format: YYYY-MM-DD
        time_format: HH:mm
        picker_utc: false
        hint: Use Indian Standard Time (+05:30).
      - label: Priority
        name: priority
        required: false
        widget: number
        value_type: int
        min: 0
        max: 9
