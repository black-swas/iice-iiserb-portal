<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f5f0"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--t-brand, #6c3231)"/>
      <stop offset="50%" stop-color="var(--t-accent, #e66a1f)"/>
      <stop offset="100%" stop-color="var(--t-accent, #e66a1f)"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e3a39"/>
      <stop offset="100%" stop-color="#552423"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="var(--t-brand, #6c3231)" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="var(--t-brand, #6c3231)" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="8" y="8" width="884" height="214" rx="22" fill="url(#bgGrad)" stroke="#e8e2d8" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Connecting Beam Track -->
  <line x1="120" y1="80" x2="780" y2="80" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="80" x2="780" y2="80" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Node 01: Idea Validation -->
  <g class="node">
    <circle cx="135" cy="80" r="30" fill="url(#nodeGrad)" stroke="var(--t-accent, #e66a1f)" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle cx="135" cy="80" r="23" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="135" y="86" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">01</text>
    <text x="135" y="142" text-anchor="middle" fill="#23201e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14.5" font-weight="700">Idea Validation</text>
    <text x="135" y="162" text-anchor="middle" fill="#6b5e5c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="500">Problem-solution fit</text>
    <text x="135" y="178" text-anchor="middle" fill="var(--t-accent, #e66a1f)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">TRL 1 · Concept</text>
  </g>

  <!-- Node 02: Faculty Mentorship -->
  <g class="node">
    <circle cx="345" cy="80" r="30" fill="url(#nodeGrad)" stroke="var(--t-accent, #e66a1f)" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle cx="345" cy="80" r="23" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="345" y="86" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">02</text>
    <text x="345" y="142" text-anchor="middle" fill="#23201e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14.5" font-weight="700">Faculty Mentorship</text>
    <text x="345" y="162" text-anchor="middle" fill="#6b5e5c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="500">IISERB academic advisory</text>
    <text x="345" y="178" text-anchor="middle" fill="var(--t-accent, #e66a1f)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">TRL 2 · Research</text>
  </g>

  <!-- Node 03: Student Innovation Grant -->
  <g class="node">
    <circle cx="555" cy="80" r="30" fill="url(#nodeGrad)" stroke="var(--t-accent, #e66a1f)" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle cx="555" cy="80" r="23" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="555" y="86" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">03</text>
    <text x="555" y="142" text-anchor="middle" fill="#23201e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14.5" font-weight="700">Student Innovation Grant</text>
    <text x="555" y="162" text-anchor="middle" fill="#6b5e5c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="500">Pre-seed catalytic support</text>
    <text x="555" y="178" text-anchor="middle" fill="var(--t-accent, #e66a1f)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">TRL 2–3 · Grant</text>
  </g>

  <!-- Node 04: Pre-Incubation -->
  <g class="node">
    <circle cx="765" cy="80" r="30" fill="url(#nodeGrad)" stroke="var(--t-accent, #e66a1f)" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle cx="765" cy="80" r="23" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="765" y="86" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">04</text>
    <text x="765" y="142" text-anchor="middle" fill="#23201e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14.5" font-weight="700">Pre-Incubation</text>
    <text x="765" y="162" text-anchor="middle" fill="#6b5e5c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="500">Cohort onboarding &amp; POC</text>
    <text x="765" y="178" text-anchor="middle" fill="var(--t-accent, #e66a1f)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">TRL 3 · Venture</text>
  </g>
</svg>